<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tier Icon Maker</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.panel {
    background: #191919;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 18px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input[type="text"],
input[type="file"],
select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #292929;
    color: white;
}

input[type="range"] {
    width: 100%;
}

input[type="color"] {
    width: 60px;
    height: 40px;
    border: none;
    padding: 0;
    background: none;
}

.range-value {
    display: block;
    text-align: right;
    color: #aaa;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

.secondary {
    background: #333;
}

canvas {
    display: block;
    width: 100%;
    max-width: 600px;
    margin: auto;
    border-radius: 10px;
    background: #222;
}

.control-group {
    margin-bottom: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>Tier Icon Maker</h1>


<!-- IMAGE -->

<div class="panel">

<h2>Image</h2>

<label>Upload Image</label>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<label>Zoom</label>

<input
    type="range"
    id="zoom"
    min="0.5"
    max="3"
    step="0.01"
    value="1"
>

<span class="range-value" id="zoomValue">
1.00x
</span>


<label>Horizontal Position</label>

<input
    type="range"
    id="imageX"
    min="-300"
    max="300"
    value="0"
>

<span class="range-value" id="imageXValue">
0
</span>


<label>Vertical Position</label>

<input
    type="range"
    id="imageY"
    min="-300"
    max="300"
    value="0"
>

<span class="range-value" id="imageYValue">
0
</span>

</div>



<!-- TEXT -->

<div class="panel">

<h2>Text</h2>

<label>Character Name</label>

<input
    type="text"
    id="characterName"
    placeholder="Ryomen Sukuna"
>


<label>Version</label>

<input
    type="text"
    id="version"
    placeholder="Heian Era"
>


<label>Font</label>

<select id="font">

<option value="Arial">
Arial
</option>

<option value="Impact">
Impact
</option>

<option value="Georgia">
Georgia
</option>

<option value="Verdana">
Verdana
</option>

<option value="Trebuchet MS">
Trebuchet MS
</option>

<option value="Courier New">
Courier New
</option>

</select>


<label>Name Size</label>

<input
    type="range"
    id="nameSize"
    min="15"
    max="80"
    value="42"
>

<span class="range-value" id="nameSizeValue">
42px
</span>


<label>Version Size</label>

<input
    type="range"
    id="versionSize"
    min="10"
    max="50"
    value="26"
>

<span class="range-value" id="versionSizeValue">
26px
</span>


<label>Text Vertical Position</label>

<input
    type="range"
    id="textY"
    min="350"
    max="590"
    value="525"
>

<span class="range-value" id="textYValue">
525
</span>

</div>



<!-- COLORS -->

<div class="panel">

<h2>Appearance</h2>


<label>Background Color</label>

<input
    type="color"
    id="backgroundColor"
    value="#111111"
>


<label>Text Color</label>

<input
    type="color"
    id="textColor"
    value="#ffffff"
>


<label>Border Color</label>

<input
    type="color"
    id="borderColor"
    value="#ffffff"
>


<label>Border Thickness</label>

<input
    type="range"
    id="borderWidth"
    min="0"
    max="25"
    value="6"
>

<span class="range-value" id="borderWidthValue">
6px
</span>

</div>



<!-- PREVIEW -->

<div class="panel">

<h2 style="text-align:center;">
Preview
</h2>

<canvas
    id="canvas"
    width="600"
    height="600"
></canvas>


<button onclick="downloadIcon()">
Download PNG
</button>


<button
    class="secondary"
    onclick="resetEditor()"
>
Reset
</button>

</div>

</div>



<script>

let uploadedImage = null;

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const imageInput =
document.getElementById("imageInput");



/* CONTROLS */

const zoom =
document.getElementById("zoom");

const imageX =
document.getElementById("imageX");

const imageY =
document.getElementById("imageY");

const characterName =
document.getElementById("characterName");

const version =
document.getElementById("version");

const font =
document.getElementById("font");

const nameSize =
document.getElementById("nameSize");

const versionSize =
document.getElementById("versionSize");

const textY =
document.getElementById("textY");

const backgroundColor =
document.getElementById("backgroundColor");

const textColor =
document.getElementById("textColor");

const borderColor =
document.getElementById("borderColor");

const borderWidth =
document.getElementById("borderWidth");



/* IMAGE UPLOAD */

imageInput.addEventListener(
"change",
function(event) {

    const file =
    event.target.files[0];

    if (!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e) {

        const img =
        new Image();

        img.onload =
        function() {

            uploadedImage = img;

            drawCanvas();

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

});



/* LIVE CONTROLS */

const controls = [

zoom,
imageX,
imageY,
characterName,
version,
font,
nameSize,
versionSize,
textY,
backgroundColor,
textColor,
borderColor,
borderWidth

];


controls.forEach(control => {

    control.addEventListener(
    "input",
    function() {

        updateValues();

        drawCanvas();

    });

});



/* VALUE LABELS */

function updateValues() {

    document.getElementById(
        "zoomValue"
    ).textContent =
        parseFloat(zoom.value).toFixed(2)
        + "x";


    document.getElementById(
        "imageXValue"
    ).textContent =
        imageX.value;


    document.getElementById(
        "imageYValue"
    ).textContent =
        imageY.value;


    document.getElementById(
        "nameSizeValue"
    ).textContent =
        nameSize.value + "px";


    document.getElementById(
        "versionSizeValue"
    ).textContent =
        versionSize.value + "px";


    document.getElementById(
        "textYValue"
    ).textContent =
        textY.value;


    document.getElementById(
        "borderWidthValue"
    ).textContent =
        borderWidth.value + "px";

}



function drawCanvas() {

    /* BACKGROUND */

    ctx.fillStyle =
        backgroundColor.value;

    ctx.fillRect(
        0,
        0,
        600,
        600
    );


    /* IMAGE */

    if (uploadedImage) {

        const scale =
            Math.max(
                600 / uploadedImage.width,
                600 / uploadedImage.height
            ) * parseFloat(zoom.value);


        const width =
            uploadedImage.width * scale;

        const height =
            uploadedImage.height * scale;


        const x =
            (600 - width) / 2
            + parseFloat(imageX.value);


        const y =
            (600 - height) / 2
            + parseFloat(imageY.value);


        ctx.drawImage(
            uploadedImage,
            x,
            y,
            width,
            height
        );

    }


    /* DARK GRADIENT */

    const gradient =
        ctx.createLinearGradient(
            0,
            300,
            0,
            600
        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0.9)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        300,
        600,
        300
    );



    /* TEXT */

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        textColor.value;


    ctx.font =
        "bold "
        + nameSize.value
        + "px "
        + font.value;


    ctx.fillText(
        characterName.value ||
        "CHARACTER",

        300,

        parseInt(textY.value)
    );


    ctx.font =
        "bold "
        + versionSize.value
        + "px "
        + font.value;


    ctx.fillText(
        version.value ||
        "VERSION",

        300,

        parseInt(textY.value) + 42
    );



    /* BORDER */

    if (
        parseInt(borderWidth.value)
        > 0
    ) {

        ctx.strokeStyle =
            borderColor.value;

        ctx.lineWidth =
            parseInt(borderWidth.value);


        ctx.strokeRect(
            borderWidth.value / 2,
            borderWidth.value / 2,
            600 - borderWidth.value,
            600 - borderWidth.value
        );

    }

}



/* DOWNLOAD */

function downloadIcon() {

    const link =
        document.createElement("a");


    let name =
        characterName.value
        || "tier-icon";


    let ver =
        version.value
        || "version";


    name =
        name.replace(
            /[^a-z0-9]/gi,
            "_"
        );


    ver =
        ver.replace(
            /[^a-z0-9]/gi,
            "_"
        );


    link.download =
        name + "_" + ver + ".png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}



/* RESET */

function resetEditor() {

    zoom.value = 1;

    imageX.value = 0;

    imageY.value = 0;

    characterName.value = "";

    version.value = "";

    font.value = "Arial";

    nameSize.value = 42;

    versionSize.value = 26;

    textY.value = 525;

    backgroundColor.value =
        "#111111";

    textColor.value =
        "#ffffff";

    borderColor.value =
        "#ffffff";

    borderWidth.value = 6;


    updateValues();

    drawCanvas();

}



/* INITIAL */

updateValues();

drawCanvas();

</script>

</body>
</html>
